[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb"
version = "0.1.0"
description = "Latency-first YES+NO bundle arb bot for Polymarket BTC 5-minute Up/Down markets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "eth-account>=0.13",
  "py-clob-client-v2>=1.1.0",
  "streamlit>=1.60",
  "websockets>=12",
  "python-dotenv>=1.0",
  # Kronos cold-path volatility regime forecasting
  "torch>=2.0.0",
  "einops==0.8.1",
  "numpy",
  "pandas",
  "safetensors",
  "huggingface_hub>=0.33.1",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
polymarket-arb = "polymarket_arb.main:main"
polymarket-scan = "polymarket_arb.scan:main"

[tool.setuptools.packages.find]
include = ["polymarket_arb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
