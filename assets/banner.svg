<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="ARBITER: when YES plus NO costs less than one dollar">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6ee7a8" stroke-opacity=".55" stroke-width="1.6"/>
    </pattern>
    <radialGradient id="bloom" cx=".12" cy=".1" r=".9">
      <stop offset="0" stop-color="#6ee7a8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bar"><rect x="776" y="150" width="400" height="54"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-size: 12px; letter-spacing: 5.5px; font-weight: 600; fill: #6ee7a8; }
    .title { font-size: 136px; font-weight: 700; letter-spacing: -6px; fill: #f4f7fb; }
    .sub { font-size: 23px; fill: #a4aebf; font-weight: 300; }
    .meta { font-size: 11px; letter-spacing: 2.4px; fill: #74808f; }
    .row { opacity: 0; animation: fade .45s ease forwards; }
    .sweep { animation: sweep 3.4s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .live { animation: blink 2.2s steps(1) infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(440px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: .15; } }
  </style>

  <rect width="1280" height="440" fill="#06080b"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#bloom)"/>

  <!-- left: type -->
  <text x="72" y="122" class="sans kicker">POLYMARKET ARBITRAGE · PAPER BY DEFAULT</text>
  <text x="62" y="252" class="sans title">Arbiter</text>
  <text x="72" y="304" class="sans sub">Two sides of one market, priced together.</text>
  <text x="72" y="336" class="sans sub">When YES + NO costs under $1.00, the gap is yours.</text>
  <g class="mono meta">
    <text x="72" y="392" class="row" style="animation-delay:.15s">LIVE ORDER BOOKS · DEPTH-WALKED FILLS · 991 TESTS</text>
    <text x="72" y="414" class="row" style="animation-delay:.35s">2,070 MARKETS SCANNED · NEVER LEAVES A NAKED LEG</text>
  </g>

  <!-- right: the dollar bar -->
  <g class="row" style="animation-delay:.1s">
    <rect x="744" y="64" width="464" height="312" rx="16" fill="#0b0f16" stroke="#1b2433"/>
    <text x="776" y="98" class="mono" font-size="10" letter-spacing="2.6" fill="#6b7687">POLYMARKET · BTC UP / DOWN</text>
    <circle class="live" cx="1178" cy="94" r="4" fill="#6ee7a8"/>
    <text x="1166" y="98" class="mono" font-size="9.5" letter-spacing="2" fill="#6b7687" text-anchor="end">LIVE</text>

    <!-- edge label -->
    <text x="1176" y="140" class="mono" font-size="10.5" letter-spacing="1.6" fill="#6ee7a8" text-anchor="end">EDGE +0.0500</text>

    <!-- bar: 0.47 yes | 0.48 no | 0.05 gap -->
    <g clip-path="url(#bar)">
      <rect x="776" y="150" width="188" height="54" fill="#12754f"/>
      <rect x="964" y="150" width="192" height="54" fill="#83293a"/>
      <rect x="1156" y="150" width="20" height="54" fill="url(#hatch)"/>
      <rect class="sweep" x="776" y="150" width="120" height="54" fill="url(#sweep)"/>
    </g>
    <rect x="776" y="150" width="400" height="54" fill="none" stroke="#1b2433"/>
    <line x1="964" y1="150" x2="964" y2="204" stroke="#06080b" stroke-width="1.5"/>
    <line x1="1156" y1="150" x2="1156" y2="204" stroke="#06080b" stroke-width="1.5"/>
    <text x="870" y="184" class="mono" font-size="13" letter-spacing="1.2" fill="#d7f7e6" text-anchor="middle">YES 0.4700</text>
    <text x="1060" y="184" class="mono" font-size="13" letter-spacing="1.2" fill="#ffd9df" text-anchor="middle">NO 0.4800</text>
    <circle class="pulse" cx="1166" cy="177" r="2" fill="#6ee7a8"/>

    <!-- axis -->
    <g class="mono" font-size="9" letter-spacing="1" fill="#4c5766">
      <text x="776" y="222">0</text>
      <text x="876" y="222" text-anchor="middle">.25</text>
      <text x="976" y="222" text-anchor="middle">.50</text>
      <text x="1076" y="222" text-anchor="middle">.75</text>
      <text x="1176" y="222" text-anchor="end">$1.00</text>
    </g>
    <line x1="776" y1="234" x2="1176" y2="234" stroke="#161e2a"/>

    <!-- ledger -->
    <g class="mono" font-size="11.5" letter-spacing=".4">
      <text x="776" y="260" fill="#8b96a6">YES ask</text><text x="1176" y="260" text-anchor="end" fill="#d7f7e6">0.4700</text>
      <text x="776" y="282" fill="#8b96a6">NO ask</text><text x="1176" y="282" text-anchor="end" fill="#ffd9df">0.4800</text>
      <text x="776" y="304" fill="#8b96a6">taker fees</text><text x="1176" y="304" text-anchor="end" fill="#c3ccd8">0.0036</text>
      <line x1="776" y1="316" x2="1176" y2="316" stroke="#161e2a"/>
      <text x="776" y="338" fill="#8b96a6">combined cost</text><text x="1176" y="338" text-anchor="end" fill="#eef2f8">0.9536</text>
    </g>
    <text x="776" y="362" class="mono" font-size="11" letter-spacing="2.4" fill="#6ee7a8">LOCKED EDGE</text>
    <text x="1176" y="362" class="mono" font-size="15" letter-spacing="1" fill="#6ee7a8" text-anchor="end" filter="url(#glow)">+0.0464</text>
  </g>
</svg>
