<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ARBITER: when YES plus NO costs less than one dollar">
  <style>
    .bg { fill: #0a0a0a; }
    .bid { fill: #96aaff; }
    .ask { fill: #e9e9e9; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 78px; font-weight: 700; letter-spacing: 16px; fill: #e9e9e9; }
    .sub { font-size: 20px; letter-spacing: 6px; fill: #8a8a8a; }
    .eq { font-size: 26px; fill: #e9e9e9; letter-spacing: 2px; }
    .edge { fill: #9be7c4; }
    .glyph { font-size: 11px; fill: #96aaff; opacity: .16; }
    .bar { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; }
    .bid.bar { transform-origin: right center; }
    .ask.bar { transform-origin: left center; }
    .d1 { animation-delay: -.4s; } .d2 { animation-delay: -.9s; } .d3 { animation-delay: -1.5s; }
    .d4 { animation-delay: -2.1s; } .d5 { animation-delay: -2.6s; }
    .spread { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.82); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bar, .spread { animation: none; } }
  </style>
  <rect class="bg" width="1280" height="420"/>

  <!-- faint glyph field -->
  <text class="mono glyph" x="24" y="40">kQ8x2LmZ0aP4vR7tYw1bN6cJ3hF9sD5gK2eU8iO0pL7qM4zX1vB6nC3yT9rW5uA2</text>
  <text class="mono glyph" x="24" y="392">Hj4Kd8Ls2Qw6Er0Ty3Ui7Op1As5Df9Gh2Jk6Lz0Xc4Vb8Nm1Qa5Ws9Ed3Rf7Tg2Yh6</text>

  <!-- bids (left) -->
  <g>
    <rect class="bid bar d1" x="140" y="110" width="250" height="14" rx="1" opacity=".95"/>
    <rect class="bid bar d2" x="180" y="134" width="210" height="14" rx="1" opacity=".8"/>
    <rect class="bid bar d3" x="110" y="158" width="280" height="14" rx="1" opacity=".65"/>
    <rect class="bid bar d4" x="210" y="182" width="180" height="14" rx="1" opacity=".5"/>
    <rect class="bid bar d5" x="160" y="206" width="230" height="14" rx="1" opacity=".38"/>
    <rect class="bid bar d1" x="240" y="230" width="150" height="14" rx="1" opacity=".26"/>
    <text class="mono sub" x="390" y="270" text-anchor="end">YES ASK 0.48</text>
  </g>
  <!-- asks (right) -->
  <g>
    <rect class="ask bar d3" x="890" y="110" width="230" height="14" rx="1" opacity=".95"/>
    <rect class="ask bar d1" x="890" y="134" width="270" height="14" rx="1" opacity=".8"/>
    <rect class="ask bar d4" x="890" y="158" width="190" height="14" rx="1" opacity=".65"/>
    <rect class="ask bar d2" x="890" y="182" width="250" height="14" rx="1" opacity=".5"/>
    <rect class="ask bar d5" x="890" y="206" width="160" height="14" rx="1" opacity=".38"/>
    <rect class="ask bar d3" x="890" y="230" width="210" height="14" rx="1" opacity=".26"/>
    <text class="mono sub" x="890" y="270">NO ASK 0.49</text>
  </g>

  <!-- center -->
  <text class="mono title" x="648" y="196" text-anchor="middle">ARBITER</text>
  <text class="mono eq" x="640" y="322" text-anchor="middle">0.48 + 0.49 = 0.97 <tspan class="edge spread">→ +$0.03 locked</tspan></text>
  <text class="mono sub" x="640" y="376" text-anchor="middle">POLYMARKET ARBITRAGE · REAL BOOKS · PAPER FILLS</text>
</svg>
